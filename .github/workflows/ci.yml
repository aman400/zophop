name: Android CI Build & Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run All Module Unit & Integration Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APKs (App, Telegram & SMTP Plugins) & Plugin AARs
        run: ./gradlew :app:assembleDebug :external:telegram:assembleDebug :external:smtp:assembleDebug :core:plugin-api:assembleRelease :core:model:assembleRelease --stacktrace

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zophop-ci-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            external/telegram/build/outputs/apk/debug/*.apk
            external/smtp/build/outputs/apk/debug/*.apk
            core/plugin-api/build/outputs/aar/*.aar
            core/model/build/outputs/aar/*.aar

      - name: Upload Test Reports On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
