name: Build & Publish Release APKs & Plugin SDK

on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APKs & Plugin AARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore (Optional Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit & Integration Tests Before Release
        run: ./gradlew test --stacktrace

      - name: Build Release APKs (App, Telegram & SMTP Plugins) & Plugin AAR Libraries
        env:
          INPUT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="${{ github.workspace }}/release.keystore"
          export KEYSTORE_PASSWORD="${INPUT_KEYSTORE_PASSWORD:-zophop_secret}"
          export KEY_ALIAS="${INPUT_KEY_ALIAS:-zophop_key}"
          export KEY_PASSWORD="${INPUT_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          ./gradlew :app:assembleRelease :external:telegram:assembleRelease :external:smtp:assembleRelease :core:plugin-api:assembleRelease :core:model:assembleRelease --stacktrace

      - name: Stage Release Assets (App APK, Telegram & SMTP Plugin APKs, Plugin SDK AARs)
        run: |
          rm -rf release-assets
          mkdir -p release-assets

          APP_VERSION=$(grep -E '^ZOPHOP_VERSION=' gradle.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
          APP_VERSION="${APP_VERSION:-1.0.0}"

          cp "app/build/outputs/apk/release/ZopHop-v${APP_VERSION}.apk" release-assets/
          cp "external/telegram/build/outputs/apk/release/ZopHop-Telegram-Plugin-v${APP_VERSION}.apk" release-assets/
          cp "external/smtp/build/outputs/apk/release/ZopHop-SMTP-Plugin-v${APP_VERSION}.apk" release-assets/
          cp "core/plugin-api/build/outputs/aar/zophop-plugin-api-v${APP_VERSION}.aar" release-assets/
          cp "core/model/build/outputs/aar/zophop-core-model-v${APP_VERSION}.aar" release-assets/

          ls -lh release-assets/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZopHop-Release-Assets
          path: release-assets/*

      - name: Attach APKs & Plugin AARs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-assets/*.apk
            release-assets/*.aar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
